<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 6 단원평가 | Happy Digital Laundry</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#f0f6fc;--sub:#9da7b3;--accent:#58a6ff;--ok:#3fb950;--no:#f85149;--warn:#d29922}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:600;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:760px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:28px}
h1{font-size:30px;font-weight:900;margin-bottom:8px}
.sub{color:var(--sub);font-size:17px;margin-bottom:22px;line-height:1.6}
.btn{display:block;width:100%;padding:16px;border:2px solid var(--line);border-radius:12px;background:#21262d;color:var(--text);font-size:19px;font-weight:700;text-align:left;cursor:pointer;margin-bottom:12px;font-family:inherit}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.main{background:var(--accent);color:#0d1117;border-color:var(--accent);text-align:center;font-weight:900}
.btn.ok{background:rgba(63,185,80,.2);border-color:var(--ok)}
.btn.no{background:rgba(248,81,73,.2);border-color:var(--no)}
.btn:disabled{cursor:default}
.row{display:flex;gap:10px}.row .btn{flex:1;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;color:var(--sub)}
.tag{background:#21262d;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--accent);font-weight:800}
.bar{height:8px;background:#21262d;border-radius:8px;overflow:hidden;margin-bottom:22px}
.bar div{height:100%;background:var(--accent);transition:width .3s}
.q{font-size:23px;font-weight:800;line-height:1.55;margin-bottom:22px;word-break:keep-all}
input[type=text]{width:100%;padding:16px;font-size:21px;font-weight:700;border-radius:12px;border:2px solid var(--line);background:#0d1117;color:var(--text);margin-bottom:12px;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.fb{font-size:19px;font-weight:800;margin:6px 0 16px;min-height:26px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.score{font-size:64px;font-weight:900;text-align:center;color:var(--accent);margin:10px 0}
.secs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}
.secs div{background:#21262d;border-radius:10px;padding:10px 4px;text-align:center;font-size:15px;color:var(--sub)}
.secs b{display:block;font-size:20px;color:var(--text);margin-top:4px}
.rev{border-top:1px solid var(--line);padding:14px 0;font-size:16px;line-height:1.6}
.rev .rq{font-weight:800;margin-bottom:4px}
.rev .mine{color:var(--no)}.rev .right{color:var(--ok)}
label.opt{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:12px;color:var(--sub)}
label.opt input{width:20px;height:20px}
@media(max-width:520px){.q{font-size:20px}.btn{font-size:17px}.secs{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"></div></div>
<script>
const DATA=[{"s": "어휘", "q": "'apologize'의 우리말 뜻은?", "type": "m", "opts": ["삭제하다", "사과하다", "공유하다", "보호하다"], "c": 1}, {"s": "어휘", "q": "'immediately'의 우리말 뜻은?", "type": "m", "opts": ["여전히", "무료로", "즉시", "조심스럽게"], "c": 2}, {"s": "어휘", "q": "'footprint'의 우리말 뜻은?", "type": "m", "opts": ["발자국", "출처", "복사본", "기록"], "c": 0}, {"s": "어휘", "q": "'useless'의 우리말 뜻은?", "type": "m", "opts": ["위험한", "개인적인", "알려지지 않은", "쓸모없는"], "c": 3}, {"s": "어휘", "q": "'embarrassed'의 우리말 뜻은?", "type": "m", "opts": ["화가 난", "당황한", "걱정하는", "신이 난"], "c": 1}, {"s": "어휘", "q": "a place where something comes from", "type": "m", "opts": ["source", "record", "device", "link"], "c": 0}, {"s": "어휘", "q": "to say sorry", "type": "m", "opts": ["remove", "erase", "apologize", "receive"], "c": 2}, {"s": "어휘", "q": "likely to cause harm or injury", "type": "m", "opts": ["embarrassed", "digital", "personal", "dangerous"], "c": 3}, {"s": "어휘", "q": "something that is made to be the same as another", "type": "m", "opts": ["copy", "comment", "history", "laundry"], "c": 0}, {"s": "어휘", "q": "I'll ____ for lunch today. (내가 오늘 점심값을 지불할게.)", "type": "m", "opts": ["pay", "share", "click", "select"], "c": 0}, {"s": "어휘", "q": "You should not ____ fake news on the Internet. (가짜 뉴스를 퍼뜨리면 안 된다.)", "type": "m", "opts": ["protect", "spread", "remain", "receive"], "c": 1}, {"s": "어휘", "q": "She will ____ for a yoga class. (요가 수업에 등록할 것이다.)", "type": "m", "opts": ["fill out", "sign up", "instead of", "for free"], "c": 1}, {"s": "듣기", "q": "[Listen and Talk A] 공유 자전거를 이용하는 순서로 알맞은 것은?", "type": "m", "opts": ["앱 가입 → 신용카드 등록 → 휴대폰 태그", "휴대폰 태그 → 앱 가입 → 신용카드 등록", "신용카드 등록 → 앱 가입 → 휴대폰 태그", "앱 가입 → 휴대폰 태그 → 신용카드 등록"], "c": 0}, {"s": "듣기", "q": "[Listen and Talk A] 엄마와 아이가 박물관에 가기 위해 타야 할 버스는?", "type": "m", "opts": ["207번", "270번", "720번", "27번"], "c": 1}, {"s": "듣기", "q": "[Listen and Talk A] 키오스크로 주문할 때 마지막 단계는?", "type": "m", "opts": ["햄버거 고르기", "사이드 메뉴와 음료 고르기", "다음 페이지에서 결제하기", "카드 등록하기"], "c": 2}, {"s": "듣기", "q": "[Listen and Talk B] 에어프라이어로 고구마를 구울 때 맞춘 온도와 시간은?", "type": "m", "opts": ["180°C, 20분", "200°C, 20분", "200°C, 30분", "220°C, 15분"], "c": 1}, {"s": "듣기", "q": "[Listen and Talk B] What should Lily use when she takes the sweet potatoes out?", "type": "m", "opts": ["a spoon", "a plate", "oven gloves", "a timer"], "c": 2}, {"s": "듣기", "q": "[Enjoy the Clip] MuzSearch 앱으로 할 수 있는 일은?", "type": "m", "opts": ["노래 제목 찾기", "노래 녹음하기", "가사 번역하기", "음악 수업 예약하기"], "c": 0}, {"s": "문법", "q": "I saw him ____ a kite. (나는 그가 연 날리는 것을 보았다.)", "type": "m", "opts": ["to fly", "flies", "fly", "flew"], "c": 2}, {"s": "문법", "q": "She heard the baby ____. (그녀는 아기가 울고 있는 소리를 들었다.)", "type": "m", "opts": ["to cry", "crying", "cried", "cries"], "c": 1}, {"s": "문법", "q": "I heard my name ____. (나는 내 이름이 불리는 것을 들었다.)", "type": "m", "opts": ["call", "calling", "called", "to call"], "c": 2}, {"s": "문법", "q": "John wants Mary ____ him. (John은 Mary가 그에게 전화해 주기를 원한다.)", "type": "m", "opts": ["call", "to call", "calling", "called"], "c": 1}, {"s": "문법", "q": "Emily told Tom ____ the window. (Emily는 Tom에게 창문을 닫으라고 말했다.)", "type": "m", "opts": ["close", "closing", "to close", "closed"], "c": 2}, {"s": "문법", "q": "Lisa: \"Michael, keep the windows open, please.\" → Lisa ____.", "type": "m", "opts": ["asks Michael keep the windows open", "asks Michael to keep the windows open", "asks to Michael keep the windows open", "asks Michael keeping the windows open"], "c": 1}, {"s": "문법", "q": "어법상 올바른 문장은?", "type": "m", "opts": ["I want you study harder.", "They asked us to wait outside.", "Mom told me cleaning my room.", "He felt the wind to blow."], "c": 1}, {"s": "문법", "q": "어법상 어색한 문장은?", "type": "m", "opts": ["I felt my body trembling.", "She heard the man playing the piano.", "He saw me to climb the tree.", "We saw the boy running in the park."], "c": 2}, {"s": "문법", "q": "One of his friends asked Tom ____ the ball to him.", "type": "m", "opts": ["throw", "to throw", "throwing", "threw"], "c": 1}, {"s": "문법", "q": "My brother wanted me ____ the picture of him.", "type": "m", "opts": ["delete", "deleting", "to delete", "deleted"], "c": 2}, {"s": "문법", "q": "Oh, my! I just heard my phone ____ again.", "type": "m", "opts": ["ringing", "to ring", "rang", "rings"], "c": 0}, {"s": "독해", "q": "What does Happy Digital Laundry do?", "type": "m", "opts": ["It washes your clothes.", "It cleans your online history.", "It sells new smartphones.", "It makes websites for free."], "c": 1}, {"s": "독해", "q": "What was Bella's brother doing after school?", "type": "m", "opts": ["playing soccer", "playing basketball", "reading a book", "taking pictures"], "c": 1}, {"s": "독해", "q": "Why was Bella so embarrassed?", "type": "m", "opts": ["Her brother lost the game.", "A copy of the picture with bad comments was spread.", "She lost her smartphone.", "Her post got no comments."], "c": 1}, {"s": "독해", "q": "What did Bella do after her brother asked her to delete the picture?", "type": "m", "opts": ["She apologized and deleted her post immediately.", "She made another copy of the picture.", "She shared the picture again.", "She left bad comments."], "c": 0}, {"s": "독해", "q": "Where may some copies of Bella's picture still remain?", "type": "m", "opts": ["on her brother's website", "on personal devices", "in the ad company", "on the school's computer"], "c": 1}, {"s": "독해", "q": "What lesson does Bella's case show?", "type": "m", "opts": ["Sharing something online is easy, but removing it is hard.", "Taking pictures is always dangerous.", "Social media is useless.", "You should not play basketball after school."], "c": 0}, {"s": "독해", "q": "What did Jihun want to get for free?", "type": "m", "opts": ["a new laptop", "a new smartphone", "a gift card", "a game"], "c": 1}, {"s": "독해", "q": "What has Jihun received instead of a new smartphone?", "type": "m", "opts": ["a thank-you letter", "useless emails and phone calls from unknown numbers", "a free gift", "a new password"], "c": 1}, {"s": "독해", "q": "What did Happy Digital Laundry do for Jihun?", "type": "m", "opts": ["They changed his phone number.", "They bought him a new smartphone.", "They asked the ad company to delete his personal information.", "They deleted all his emails."], "c": 2}, {"s": "독해", "q": "본문의 내용과 일치하지 않는 것은?", "type": "m", "opts": ["Jihun got a new smartphone for free.", "Removing something online is not easy.", "The copy of Bella's picture was spread online.", "You should not click on links from unknown sources."], "c": 0}, {"s": "독해", "q": "Clicking on advertisements or links from unknown sources is ____.", "type": "m", "opts": ["safe", "useful", "dangerous", "free"], "c": 2}, {"s": "주관식", "q": "Do you want to e____ it? (그것을 지우고 싶나요?) 빈칸에 알맞은 단어를 완전한 형태로 쓰시오.", "type": "t", "ans": "erase"}, {"s": "주관식", "q": "We can clean your online ____. (온라인 기록) 빈칸에 알맞은 한 단어를 쓰시오.", "type": "t", "ans": "history"}, {"s": "주관식", "q": "L____ a message on our website, and we'll help you soon. 빈칸에 알맞은 단어를 완전한 형태로 쓰시오.", "type": "t", "ans": "Leave"}, {"s": "주관식", "q": "I ____ to him, and I deleted my post immediately. (저는 그에게 사과했어요.) 빈칸에 알맞은 한 단어를 쓰시오.", "type": "t", "ans": "apologized"}, {"s": "주관식", "q": "However, the copies still ____ online. (여전히 남아 있다) 빈칸에 알맞은 한 단어를 쓰시오.", "type": "t", "ans": "remain"}, {"s": "주관식", "q": "It said that I could get a new smartphone ____ ____. (무료로) 빈칸에 알맞은 두 단어를 쓰시오.", "type": "t", "ans": "for free"}, {"s": "주관식", "q": "Then, I ____ ____ my information to receive the gift. (작성했다) 빈칸에 알맞은 두 단어를 쓰시오.", "type": "t", "ans": "filled out"}, {"s": "주관식", "q": "Don't click on ads or links from unknown ____. (출처) 빈칸에 알맞은 한 단어를 쓰시오.", "type": "t", "ans": "sources"}, {"s": "주관식", "q": "I saw him ____ to school. (나는 그가 학교로 뛰어가고 있는 것을 보았다.) 빈칸에 알맞은 한 단어를 쓰시오.", "type": "t", "ans": "running"}, {"s": "주관식", "q": "Sophia asked me ____ ____ the dishes. (Sophia는 내게 설거지를 해 달라고 요청했다.) 빈칸에 알맞은 두 단어를 쓰시오.", "type": "t", "ans": "to wash"}];
const SECS=["어휘","듣기","문법","독해","주관식"];
let list=[],idx=0,answers=[],locked=false;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  app.innerHTML=`<h1>Lesson 6 단원평가</h1>
  <p class="sub">Happy Digital Laundry<br>어휘 · 듣기 · 문법 · 독해 객관식 40문항 + 주관식 10문항<br>한 문제씩 풀면 바로 정답을 확인할 수 있습니다.</p>
  <label class="opt"><input type="checkbox" id="sh"> 문제 순서 섞기</label>
  <button class="btn main" onclick="start(DATA.map((d,i)=>i))">시작하기</button>`;
}
function start(ids){
  if(document.getElementById('sh')?.checked) ids=shuffle(ids);
  list=ids.map(i=>{const d=DATA[i];if(d.type==='m'){const o=shuffle(d.opts.map((t,k)=>({t,k})));return {...d,id:i,opts2:o};}return {...d,id:i};});
  idx=0;answers=[];show();
}
function show(){
  locked=false;const d=list[idx];
  let body='';
  if(d.type==='m'){
    body=d.opts2.map((o,k)=>`<button class="btn" data-k="${o.k}" onclick="pick(this)">${'①②③④'[k]} ${esc(o.t)}</button>`).join('');
  }else{
    body=`<input type="text" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="정답을 입력하세요">
    <button class="btn main" id="sb" onclick="typed()">제출</button>`;
  }
  app.innerHTML=`<div class="top"><span class="tag">${d.s}</span><span>${idx+1} / ${list.length}</span></div>
  <div class="bar"><div style="width:${idx/list.length*100}%"></div></div>
  <div class="q">${esc(d.q)}</div>${body}<div class="fb" id="fb"></div><div id="nx"></div>`;
  const ti=document.getElementById('ti');
  if(ti){ti.focus();ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!locked)typed();}});}
}
function done(ok,mine){
  locked=true;const d=list[idx];
  answers.push({d,ok,mine});
  const fb=document.getElementById('fb');
  const right=d.type==='m'?d.opts[d.c]:d.ans;
  fb.className='fb '+(ok?'ok':'no');
  fb.textContent=ok?'정답입니다!':'오답입니다. 정답: '+right;
  document.getElementById('nx').innerHTML=`<button class="btn main" id="nb" onclick="next()">${idx+1<list.length?'다음 문제':'결과 보기'}</button>`;
  document.getElementById('nb').focus();
}
function pick(el){
  if(locked)return;const d=list[idx];const k=+el.dataset.k;
  document.querySelectorAll('.btn[data-k]').forEach(b=>{b.disabled=true;if(+b.dataset.k===d.c)b.classList.add('ok');});
  if(k!==d.c)el.classList.add('no');
  done(k===d.c,d.opts[k]);
}
function typed(){
  if(locked)return;const ti=document.getElementById('ti');const v=ti.value;
  if(!v.trim()){ti.focus();return;}
  const d=list[idx];const ok=norm(v)===norm(d.ans);
  ti.disabled=true;ti.style.borderColor=ok?'var(--ok)':'var(--no)';
  document.getElementById('sb').style.display='none';
  done(ok,v.trim());
}
function next(){idx++;idx<list.length?show():result();}
function result(){
  const n=answers.filter(a=>a.ok).length;
  const per=SECS.map(s=>{const a=answers.filter(x=>x.d.s===s);return a.length?`<div>${s}<b>${a.filter(x=>x.ok).length}/${a.length}</b></div>`:'';}).join('');
  const wrong=answers.filter(a=>!a.ok);
  const rev=wrong.map(a=>{const r=a.d.type==='m'?a.d.opts[a.d.c]:a.d.ans;
    return `<div class="rev"><div class="rq">[${a.d.s}] ${esc(a.d.q)}</div><div class="mine">내 답: ${esc(a.mine)}</div><div class="right">정답: ${esc(r)}</div></div>`;}).join('');
  app.innerHTML=`<h1>결과</h1><div class="score">${n} / ${answers.length}</div>
  <p class="sub" style="text-align:center">${Math.round(n/answers.length*100)}점</p>
  <div class="secs">${per}</div>
  <div class="row">${wrong.length?`<button class="btn main" onclick="start([${wrong.map(a=>a.d.id)}])">틀린 문제 다시 풀기</button>`:''}
  <button class="btn" onclick="home()">처음으로</button></div>
  ${wrong.length?'<h2 style="font-size:22px;margin:22px 0 6px">틀린 문제 확인</h2>'+rev:'<p class="sub" style="text-align:center;margin-top:16px">모두 맞혔습니다!</p>'}`;
}
home();
</script>
</body>
</html>
